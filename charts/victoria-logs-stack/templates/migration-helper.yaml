{{- if .Values.migration.helper.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-logs-migration-helper
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "victoria-logs-stack.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: victoria-logs-migration-helper
    app.kubernetes.io/component: migration
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs-migration-helper
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-logs-migration-helper
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: victoria-logs
        app.kubernetes.io/component: migration
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      containers:
        - name: migration-helper
          image: {{ .Values.migration.helper.image }}
          imagePullPolicy: {{ .Values.migration.helper.imagePullPolicy }}
          command:
            - sleep
            - "2147483647"
          readinessProbe:
            exec:
              command:
                - test
                - -d
                - /victoria-logs-data
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
{{ toYaml .Values.migration.helper.resources | nindent 12 }}
          volumeMounts:
            - name: victoria-logs-data
              mountPath: /victoria-logs-data
      volumes:
        - name: victoria-logs-data
          persistentVolumeClaim:
            claimName: {{ .Values.migration.helper.claimName }}
{{- include "victoria-logs-stack.scheduling" . | nindent 6 }}
{{- end }}
