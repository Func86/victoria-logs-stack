{{- if .Values.vector.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: vector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "victoria-logs-stack.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: vector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vector
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: ingress
      port: {{ .Values.vector.service.port }}
      targetPort: ingress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "victoria-logs-stack.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: vector
spec:
  replicas: {{ .Values.vector.replicas }}
  revisionHistoryLimit: 3
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vector
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: victoria-logs
      annotations:
        checksum/vector-config: {{ include (print $.Template.BasePath "/vector-configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: vector
          image: {{ .Values.vector.image }}
          imagePullPolicy: {{ .Values.vector.imagePullPolicy }}
          args:
            - --config
            - /etc/vector/vector.yaml
          ports:
            - name: ingress
              containerPort: 8686
            - name: api
              containerPort: {{ .Values.vector.apiPort }}
          startupProbe:
            httpGet:
              path: /health
              port: api
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: api
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: api
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 2
          resources:
{{ toYaml .Values.vector.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/vector/vector.yaml
              subPath: vector.yaml
              readOnly: true
{{- if .Values.vector.secret.name }}
            - name: secret
              mountPath: {{ .Values.vector.secret.mountPath | quote }}
              readOnly: true
{{- end }}
            - name: data
              mountPath: /var/lib/vector
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: vector-config
{{- if .Values.vector.secret.name }}
        - name: secret
          secret:
            secretName: {{ .Values.vector.secret.name | quote }}
{{- end }}
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- include "victoria-logs-stack.scheduling" . | nindent 6 }}
{{- end }}
