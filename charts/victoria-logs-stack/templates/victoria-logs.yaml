apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "victoria-logs-stack.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: victoria-logs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: victoria-logs
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.victoriaLogs.service.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "victoria-logs-stack.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: victoria-logs
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: victoria-logs
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.victoriaLogs.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoria-logs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "victoria-logs-stack.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: victoria-logs
spec:
  serviceName: victoria-logs-headless
  replicas: 1
  revisionHistoryLimit: 3
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-logs
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: victoria-logs
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: victoria-logs
          image: {{ .Values.victoriaLogs.image }}
          imagePullPolicy: {{ .Values.victoriaLogs.imagePullPolicy }}
          args:
            - -storageDataPath=/victoria-logs-data
            - -retentionPeriod={{ .Values.victoriaLogs.retentionPeriod }}
{{- range .Values.victoriaLogs.extraArgs }}
            - {{ . | quote }}
{{- end }}
          ports:
            - name: http
              containerPort: 9428
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 2
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 2
          resources:
{{ toYaml .Values.victoriaLogs.resources | nindent 12 }}
          volumeMounts:
            - name: victoria-logs-data
              mountPath: /victoria-logs-data
{{- include "victoria-logs-stack.scheduling" . | nindent 6 }}
  volumeClaimTemplates:
    - metadata:
        name: victoria-logs-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.victoriaLogs.storage.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.victoriaLogs.storage.size }}
